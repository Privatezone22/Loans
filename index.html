<script>

const toCents = (pesos) => Math.round(pesos * 100);
const toPesos = (cents) => cents / 100;

function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return { y, m, d };
}
function formatDate(y, m, d) {
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function daysInMonth(y, m) {
  return new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function daysBetween(a, b) {
  const pa = parseDate(a), pb = parseDate(b);
  return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 86400000);
}

function addMonths(dateStr, k, day) {
  const p = parseDate(dateStr);
  const total = p.m - 1 + k;
  let y = p.y + Math.floor(total / 12);
  let m = (((total % 12) + 12) % 12) + 1;
  if (day > daysInMonth(y, m)) {
    m += 1;
    if (m > 12) { m = 1; y += 1; }
    return formatDate(y, m, 1);
  }
  return formatDate(y, m, day);
}

function monthlyPayment(principal, annualRate, months) {
  const i = annualRate / 12;
  if (i === 0) return Math.ceil((principal * 100) / months) / 100;
  const pmt = (principal * i) / (1 - Math.pow(1 + i, -months));
  return Math.ceil(pmt * 100 - 1e-9) / 100;
}

function buildSchedule(loan, asOf) {
  const pay = toCents(loan.payment);
  const day = parseDate(loan.firstDue).d;
  const payments = (loan.payments || []).map((p) => ({ date: p.date, cents: toCents(p.amount) }));
  let balance = toCents(loan.principal);
  let carry = 0; // interest missed in earlier months
  let prevDue = loan.startDate;
  const rows = [];

  for (let n = 1; n <= 600 && (balance > 0 || carry > 0); n++) {
    const due = addMonths(loan.firstDue, n - 1, day);
    const interest = Math.round((balance * loan.annualRate) / 12);
    const interestDue = interest + carry;
    const received = payments
      .filter((p) => p.date > prevDue && p.date <= due)
      .reduce((s, p) => s + p.cents, 0);
    const isPast = due <= asOf;
    const owedTotal = balance + interestDue;
    const scheduled = Math.min(pay, owedTotal);

    const applied = Math.min(isPast ? received : Math.max(received, pay), owedTotal);
    const interestPaid = Math.min(applied, interestDue);
    const principalPaid = Math.min(balance, applied - interestPaid);
    const extra = Math.max(0, applied - scheduled);
    const endBalance = balance - principalPaid;
    const status = isPast ? (applied < scheduled ? "late" : "paid") : "projected";

    rows.push({
      n, prevDue, due, status,
      startBalance: toPesos(balance),
      interest: toPesos(interest),
      carriedInterest: toPesos(carry),
      scheduledPayment: toPesos(scheduled),
      received: toPesos(received),
      totalPaid: toPesos(applied),
      interestPaid: toPesos(interestPaid),
      principalPaid: toPesos(principalPaid),
      extraPrincipal: toPesos(extra),
      endBalance: toPesos(endBalance),
    });
    carry = interestDue - interestPaid;
    balance = endBalance;
    prevDue = due;
  }
  return rows;
}

function payoffAmount(loan, asOf) {
  const rows = buildSchedule(loan, asOf);
  const cur = rows.find((r) => r.due > asOf);
  if (!cur) return 0;
  const paidSoFar = (loan.payments || [])
    .filter((p) => p.date > cur.prevDue && p.date <= asOf)
    .reduce((s, p) => s + toCents(p.amount), 0);
  const owed = toCents(cur.startBalance) + toCents(cur.interest) + toCents(cur.carriedInterest) - paidSoFar;
  return toPesos(Math.max(0, owed));
}

function quickLoanQuote(amount, risk, loanDate, dueDate) {
  if (!(amount > 0)) throw new Error("Amount must be greater than 0");
  if (amount > 4000) throw new Error("Over $4,000: create it as a long-term loan");
  const day = parseDate(loanDate).d;
  const days = daysBetween(loanDate, dueDate);
  if (days <= 0) throw new Error("The payment date must be after the loan date");

  let row, base;
  if (days <= 7) { row = "1 week"; base = 5; }
  else if (days <= 15) { row = "2 weeks"; base = 12; }
  else if (dueDate <= addMonths(loanDate, 1, day)) { row = "1 month"; base = 20; }
  else if (dueDate <= addMonths(loanDate, 2, day)) { row = "2 months"; base = 28; }
  else if (dueDate <= addMonths(loanDate, 3, day)) { row = "3 months"; base = 40; }
  else throw new Error("Over 3 months: create it as a long-term loan");

  const adjustment = amount <= 500 ? 0 : amount <= 1000 ? 1 : amount <= 2000 ? 2 : amount <= 3000 ? 3 : 4;
  const rateH = (base + adjustment) * (risk === "lowrisk" ? 75 : 100);
  const repay = Math.ceil((toCents(amount) * (10000 + rateH)) / 1000000);
  return { ratePercent: rateH / 100, repay, row, adjustment };
}


function cardFirstDue(d) { return addMonths(d, parseDate(d).d <= 6 ? 0 : 1, 25); }

function cardPlan(total, months, fixed, purchaseDate) {
  if (!(total > 0)) throw new Error("Enter the total purchase amount.");
  if (!(Number.isInteger(months) && months >= 1)) throw new Error("Enter the number of months.");
  if (!purchaseDate) throw new Error("Enter the purchase date.");
  const T = toCents(total), F = toCents(fixed || 0);
  if (months > 1 && !(F > 0)) throw new Error("Enter the fixed monthly amount.");
  const last = months > 1 ? T - F * (months - 1) : T;
  if (last <= 0) throw new Error("The fixed amount times (months - 1) must be less than the total.");
  const first = cardFirstDue(purchaseDate);
  const items = [];
  for (let i = 0; i < months; i++) items.push({ n: i + 1, due: addMonths(first, i, 25), amount: toPesos(i < months - 1 ? F : last), paid: null });
  return { first, items, last: toPesos(last) };
}

function recurringRows(item, asOf) {
  const rows = [], day = parseDate(item.firstDue).d;
  for (let i = 0; i < 600; i++) {
    const due = addMonths(item.firstDue, i, day);
    if (item.endDate && due > item.endDate) break;
    const h = item.amountHistory.filter((x) => x.from <= due).pop() || item.amountHistory[0];
    const b = (item.bills || {})[due] || null, paid = (item.paid || {})[due] || null;
    rows.push({ due, scheduled: h.amount, amount: b ? b.amount : h.amount, billDate: b ? b.date : null, paid, state: paid ? "repaid" : b ? "owed" : "topay" });
    if (due >= asOf) break;
  }
  return rows;
}

const api = { cardFirstDue, recurringRows, cardPlan, buildSchedule, payoffAmount, quickLoanQuote, monthlyPayment, addMonths, daysBetween };
if (typeof module !== "undefined") module.exports = api;
if (typeof window !== "undefined") window.LoanEngine = api;

function payChart(rows){
  const n=rows.length;let c=0;const cum=rows.map(r=>c=r2(c+r.received));
  if(!n||!cum[n-1])return '<p class="mut" style="margin:0">No payments received yet.</p>';
  const W=360,H=210,L=40,R=10,T=18,B=32,mx=cum[n-1],gap=(W-L-R)/n,bw=Math.min(40,gap*.62),st=Math.max(1,Math.ceil(n/6));
  const Y=v=>T+(H-T-B)*(1-v/mx),cx=i=>L+gap*i+gap/2;
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${Y(mx*f).toFixed(1)}" y2="${Y(mx*f).toFixed(1)}" style="stroke:var(--line)"/><text x="${L-5}" y="${(Y(mx*f)+3).toFixed(1)}" text-anchor="end" ${TX}>${kfmt(mx*f)}</text>`).join('');
  const bars=rows.map((r,i)=>`<rect x="${(cx(i)-bw/2).toFixed(1)}" y="${Y(r.received).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-B-Y(r.received)).toFixed(1)}" rx="3" style="fill:var(--acc)"/>`).join('');
  const pts=cum.map((v,i)=>[cx(i),Y(v)]);
  const line=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" style="stroke:var(--ok)" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" style="fill:var(--ok)"/>`).join('');
  const xl=rows.map((r,i)=>i%st===0?`<text x="${cx(i).toFixed(1)}" y="${H-12}" text-anchor="middle" ${TX}>${MES[+r.due.slice(5,7)-1]+" '"+r.due.slice(2,4)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payments received per period and cumulative total">${grid}${bars}${line}${xl}</svg><div class="chips" style="margin-top:6px"><span><i class="dot" style="background:var(--acc)"></i>Money received</span><span><i class="dot" style="background:var(--ok)"></i>Cumulative received</span></div>`;
}

function dashData(){
  const t=today(),D={lent:0,owed:0,earned:0,exp:0,cc:0,pout:0,lost:0,cnt:{Active:0,Late:0,'Paid off':0,Renewed:0,Defaulted:0},up:[],over:[],months:{},src:{}};

    }else if(l.type==='card'){

      if(nx)D.up.push({due:nx.due,id:l.id,name:l.name,kind:'Credit card',amount:nx.amount});

      D.lent+=l.principal;D.owed+=s.bal;D.pout+=s.bal;D.earned+=s.ip;D.exp+=Math.max(0,r2(s.exp-s.ip));src(l,l.principal,s.bal);
      const past=s.rows.filter(r=>r.status!=='projected'),lp=past[past.length-1],cr=s.rows.find(r=>r.status==='projected');
      if(lp&&lp.status==='late'){const a=r2(lp.scheduledPayment-lp.totalPaid);if(a>0)D.over.push({due:lp.due,id:l.id,name:l.name,kind:'Long-term',amount:a})}

      s.rows.forEach(r=>{if(r.status==='projected')mo(r.due,r2(Math.max(0,r.totalPaid-r.received)))});
    }
  });
  return D;
}

function interestSeries(){
  const t=today(),A={},F={},mk=d=>d.slice(0,7),add=(o,k,v)=>{if(v>0)o[k]=r2((o[k]||0)+v)};
  loans.forEach(l=>{

      if(l.renewed)return;
      let cum=0;const rec=qrec(l).slice().sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
      rec.forEach(x=>{const b=Math.max(0,Math.min(cum,l.toReceive)-l.principal);cum+=x.amount;add(A,mk(x.date||l.dueDate),Math.max(0,Math.min(cum,l.toReceive)-l.principal)-b)});
      const left=l.toReceive-Math.max(cum,l.principal);if(left>0&&l.dueDate>=t&&!l.defaulted)add(F,mk(l.dueDate),left);

async function doBackup(mode){const m=$('#bkmsg');try{const bytes=new TextEncoder().encode(JSON.stringify(backupObj(),null,1));m.textContent='Making the backup...';

  if(out!=='Cancelled.'){try{localStorage.setItem(BK_KEY,today())}catch(e){}render()}const m2=$('#bkmsg');if(m2)m2.textContent=out}catch(e){m.textContent='Could not make the backup: '+(e&&e.message||e)}}
function pickBackup(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);validateBackup(o);rstData=o;rstErr=''}catch(e){rstData=null;rstErr=e instanceof SyntaxError?'That file could not be read as a backup.':e.message}armRst=false;render()};r.onerror=()=>{rstErr='That file could not be read.';render()};r.readAsText(f)}
function confirmRestore(){if(!rstData)return;if(!armRst){armRst=true;render();return}
  try{localStorage.setItem(PR_KEY,JSON.stringify(backupObj()))}catch(e){}
  applyBackup(rstData);rstData=null;armRst=false;rstErr='';go('dash')}
function undoRestore(){let o=null;try{o=JSON.parse(localStorage.getItem(PR_KEY)||'null')}catch(e){}if(!o)return;applyBackup(o);try{localStorage.removeItem(PR_KEY)}catch(e){}render()}
function cancelRestore(){rstData=null;armRst=false;rstErr='';render()}
function backupBox(){const lb=lastBackup(),n=lb?E.daysBetween(lb,today()):null;let undo=false;try{undo=!!localStorage.getItem(PR_KEY)}catch(e){}
  const rp=rstData?`<div class="box" style="margin-top:12px"><b>Backup from ${fd((rstData.date||'').slice(0,10)||today())}</b><p class="mut" style="margin:4px 0 0">${rstData.loans.length} loan${rstData.loans.length===1?'':'s'}${Array.isArray(rstData.sources)?', '+rstData.sources.length+' source'+(rstData.sources.length===1?'':'s'):''}. Restoring replaces everything on this phone with this backup.</p><div class="acts"><button class="btn bad" onclick="confirmRestore()">${armRst?'Tap again to replace my data':'Restore this backup'}</button><button class="btn sec" onclick="cancelRestore()">Cancel</button></div></div>`:'';
  return `<h2>Backup and restore</h2><div class="box"><p style="margin:0"><b>Last backup:</b> ${lb?fd(lb)+' ('+(n===0?'today':n+' day'+(n===1?'':'s')+' ago')+')':'never'}</p><p class="mut" style="margin:6px 0 0">Your loans live only on this phone. A backup is a file you keep safe, for example in Google Drive.</p><div class="acts"><button class="btn" onclick="doBackup('share')">Back up now</button><button class="btn sec" onclick="doBackup('save')">Save file</button></div><p class="mut" id="bkmsg" style="margin:8px 0 0"></p></div>
<div class="box" style="margin-top:12px"><b>Restore</b><p class="mut" style="margin:4px 0 8px">Choose a backup file you saved before.</p><input type="file" accept=".json,application/json" onchange="pickBackup(this)">${rstErr?`<p class="err">${esc(rstErr)}</p>`:''}${rp}${undo?`<div class="acts"><button class="btn sec" onclick="undoRestore()">Undo last restore</button></div>`:''}</div>`}
function backupNag(){const lb=lastBackup();if(!loans.length||(lb&&E.daysBetween(lb,today())<=30))return '';return `<button class="nag" onclick="go('more')">Back up your data. ${lb?'Last backup: '+fd(lb)+'.':'You have not made one yet.'} Tap to open.</button>`}
function srcSection(X){return `<h2>By source</h2><div class="chart">${donut(X.S)}</div>${X.S.length?`<div class="box" style="padding:0">${X.S.map(([k,v],i)=>`<div class="pay" role="button" tabindex="0" style="cursor:pointer" onclick="goSrc('${encodeURIComponent(k)}')"><span class="bd">${srcBadge(k)}<span><b>${esc(k)}</b><small>Lent ${money(v.lent)}</small></span></span><b>${money(v.owed)}</b></div>`).join('')}</div>`:''}`}
function srcBars(X){if(!X.S.length)return '';const tot=X.S.reduce((a,x)=>a+x[1].owed,0)||1;return `<h2>By source</h2>${X.S.map(([k,v],i)=>`<div class="lb" style="border-left-color:${PAL[i%6]}"><span><b>${esc(k)}</b><small><i class="tag">${Math.round(v.owed/tot*100)}% of still to collect</i>Lent ${money(v.lent)}</small></span><b>${money(v.owed)}</b></div>`).join('')}`}
function statusBlock(X){const cn=X.cn,lg=(n,c,l)=>`<span><i class="dot" style="background:${c}"></i>${l} ${n}</span>`;return `<h2>Loans by status</h2><div class="box">${cn.Active+cn.Late?`<div class="bar">${seg3(cn.Active,'var(--ok)')}${seg3(cn.Late,'var(--bad)')}</div>`:''}<div class="chips">${lg(cn.Active,'var(--ok)','Active')}${lg(cn.Late,'var(--bad)','Late')}${lg(cn['Paid off'],'var(--mut)','Paid off')}${lg(cn.Renewed,'var(--line)','Renewed')}</div></div>`}
function lbRows(a){return a.map(x=>{const tc=TC[x.kind]||'var(--mut)',bad=x.c==='bad';return `<div class="lb" role="button" tabindex="0" style="border-left-color:${bad?'var(--bad)':tc};cursor:pointer" onclick="go('detail','${x.id}')" onkeydown="if(event.key==='Enter')go('detail','${x.id}')"><span><b>${esc(x.name)}</b><small><i class="tag" style="color:${tc};border-color:${tc}">${x.kind||''}</i>${fd(x.due)}${x.tag?' ('+x.tag+')':''}</small></span><b${bad?' class="r"':''}>${money(x.amount)}</b></div>`}).join('')}
function openSec(id){go('sec',id)}
function openCC(){lf='Credit card';lq='';go('home')}
const iRow=(l,v,dim)=>`<div class="irow${dim?' dim':''}"><span>${l}</span><b class="pv">${money(v)}</b></div>`;
const iCard=(ic,title,line,rows,extra)=>`<div class="icard"><div class="ih"><span class="ico">${ic}</span><div><b>${title}</b><p>${line}</p></div></div>${extra||''}<div class="rows">${rows}</div></div>`;
const stillCard=X=>iCard('◎','Still to collect',`${money(X.D.owed)} is still out; ${money(X.back)} of the principal is back.`,iRow('Principal collected',X.back)+iRow('Still to collect',X.D.owed),`<div class="b3">${seg3(X.back,'var(--acc)')}${seg3(X.D.owed,'var(--mut);opacity:.35')}</div>`);
const overHtml=X=>{const o=X.ov.map(x=>({...x,c:x.mine?'acc':'bad'}));return `<h2 id="sec-over">Overdue</h2>${o.length?lbRows(o):'<p class="mut">Nothing is overdue.</p>'}`};
const upHtml=X=>{const u=X.up.map(x=>({...x,c:x.tag==='your bill'?'acc':'ok'}));return `<h2 id="sec-due">Due in the next 30 days</h2>${u.length?lbRows(u):'<p class="mut">Nothing due in the next 30 days.</p>'}`};
const dueHtml=X=>overHtml(X)+upHtml(X);
const DEF_ORDER=['alerts','still','cash','interest','balance','hist','over','due','source','status'];
let dashCfg={order:DEF_ORDER.slice(),off:[]};
function loadDash(){let c=null;try{c=JSON.parse(localStorage.getItem('prestamos-dash')||'null')}catch(e){}
  const order=((c&&c.order)||[]).filter(id=>DEF_ORDER.includes(id));DEF_ORDER.forEach(id=>{if(!order.includes(id))order.push(id)});
  dashCfg={order,off:((c&&c.off)||[]).filter(id=>DEF_ORDER.includes(id))}}
function saveDash(){try{localStorage.setItem('prestamos-dash',JSON.stringify(dashCfg))}catch(e){}}
loadDash();
const alertsHtml=X=>{const upSum=r2(X.up.reduce((a,x)=>a+x.amount,0)),ccn=loans.filter(l=>(l.type==='card'||l.type==='recurring')&&stats(l).bal>0).length;
  return `<h2>Pending and alerts</h2>${X.od>0?`<button class="warn" onclick="openSec('due')">${money(X.od)} is overdue. Tap to see.</button>`:''}<div class="two"><button class="acard" onclick="openSec('due')"><span class="cnt" style="background:var(--acc);color:var(--on)">${X.up.length}</span><small>Due in 30 days</small><b>${money(upSum)}</b></button><button class="acard" onclick="openCC()"><span class="cnt" style="background:${TC['Credit card']}">${ccn}</span><small>Credit card to collect</small><b>${money(X.D.cc)}</b></button></div>`};
const DSEC={alerts:{name:'Pending and alerts',f:alertsHtml},still:{name:'Still to collect',f:X=>`<div style="margin-top:20px">${stillCard(X)}</div>`},cash:{name:'Projected cash flow',f:cfBlock},interest:{name:'Projected interest income',f:intBlock},balance:{name:'Balance outlook',f:balBlock},hist:{name:'Interest earned over time',f:histBlock},over:{name:'Overdue',f:overHtml},due:{name:'Due in the next 30 days',f:upHtml},source:{name:'By source',f:srcSection},status:{name:'Loans by status',f:statusBlock}};
function dash(){
  const X=dctx(),D=X.D;
  return `<header class="top"><h1>Dashboard</h1></header>${backupNag()}${loans.length?'':'<div class="box" style="margin-bottom:12px"><span class="mut">No loans yet. Tap + to create one, or load a sample from the Loans page.</span></div>'}
<div class="panel"><button class="plain" onclick="openSec('still')"><span class="mut">Still to collect</span><div class="num">${money(D.owed)}</div></button>
<div class="two"><button class="bd plain" onclick="openSec('bal')"><span class="bdg" style="background:var(--acc)">✓</span><span><small>Principal collected</small><b>${money(X.back)}</b></span></button><button class="bd plain" onclick="openSec('int')"><span class="bdg" style="background:var(--ok)">$</span><span><small>Interest earned</small><b class="g">${money(r2(D.earned))}</b></span></button></div></div>
${dashCfg.order.filter(id=>!dashCfg.off.includes(id)).map(id=>DSEC[id].f(X)).join('')}`}
const GRIP='<svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="4" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="11" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="11" cy="16" r="1.6"/></g></svg>';
function manage(){return `<header class="top"><button class="btn lnk" onclick="go('more')">Back</button></header><h1>Manage dashboard</h1><p class="mut" style="margin:4px 0 14px">Turn sections on or off, and drag the dots to change the order. The top panel always stays first.</p><div id="mlist">${dashCfg.order.map(id=>`<div class="mrow" data-id="${id}"><span class="grip" onpointerdown="startDrag(event)" onpointermove="moveDrag(event)" onpointerup="endDrag(event)" onpointercancel="endDrag(event)" aria-label="Drag to reorder">${GRIP}</span><span class="mname">${DSEC[id].name}</span><label class="sw"><input type="checkbox" ${dashCfg.off.includes(id)?'':'checked'} onchange="toggleSec('${id}',this.checked)" aria-label="Show ${DSEC[id].name}"><span></span></label></div>`).join('')}</div><div class="acts"><button class="btn sec" onclick="resetDash()">Reset to default</button></div>`}
function toggleSec(id,on){dashCfg.off=dashCfg.off.filter(x=>x!==id);if(!on)dashCfg.off.push(id);saveDash()}
function resetDash(){dashCfg={order:DEF_ORDER.slice(),off:[]};saveDash();render()}
let drag=null;
function startDrag(e){e.preventDefault();const h=e.currentTarget,row=h.closest('.mrow');drag={h,row,list:row.parentNode,y0:e.clientY};row.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(_){}}
function moveDrag(e){if(!drag)return;const row=drag.row,list=drag.list;row.style.transform='translateY('+(e.clientY-drag.y0)+'px)';
  const rows=[...list.children],idx=rows.indexOf(row),rect=row.getBoundingClientRect(),mid=rect.top+rect.height/2;
  for(let i=0;i<rows.length;i++){if(i===idx)continue;const rr=rows[i].getBoundingClientRect(),m=rr.top+rr.height/2;
    if((i<idx&&mid<m)||(i>idx&&mid>m)){const old=rect.top;row.style.transform='none';list.insertBefore(row,i<idx?rows[i]:rows[i].nextSibling);const dy=old-row.getBoundingClientRect().top;row.style.transform='translateY('+dy+'px)';drag.y0=e.clientY-dy;break}}}
function endDrag(e){if(!drag)return;const row=drag.row,list=drag.list,h=drag.h;row.style.transform='';row.classList.remove('drag');try{h.releasePointerCapture(e.pointerId)}catch(_){}drag=null;dashCfg.order=[...list.children].map(r=>r.dataset.id);saveDash()}
function secPage(id){const X=dctx();
  const body=id==='still'?stillCard(X):id==='bal'?balBlock(X):id==='int'?intBlock(X)+histBlock(X):dueHtml(X);
  return `<header class="top"><button class="btn lnk" onclick="go('dash')">Back</button></header>${body}`}
function insights(){const X=dctx(),D=X.D;
  return `<header class="top"><h1>Insights</h1></header><h2 style="margin-top:0">Big picture</h2><p class="mut" style="margin-top:-6px">Where your loans stand at a glance.</p>
${iCard('%','Interest',`You have earned ${money(r2(D.earned))} and expect ${money(r2(D.exp))} more.`,iRow('So far this month',X.eMonth)+iRow('So far this year',X.eYear)+iRow('Projected by year-end',X.eProj,1))}
${iCard('$','Money collected',`You expect ${money(X.tot)} in the next 12 months.`,iRow('So far this month',X.cMonth)+iRow('So far this year',X.cYear)+iRow('Expected by year-end',X.cProj,1))}
${D.lost>0?iCard('✕','Lost to defaults',`${money(r2(D.lost))} of principal will not come back.`,iRow('Principal lost',D.lost)+iRow('Interest earned so far',r2(D.earned))):''}
${iCard('!','Alerts',X.od>0?`${money(X.od)} is overdue.`:'Nothing is overdue.',iRow('Overdue to collect',X.od)+iRow('Due in the next 30 days',r2(X.up.reduce((a,x)=>a+x.amount,0))))}`}
function navHtml(){const o=n=>(n==='dash'&&(view.n==='dash'||view.n==='sec'))||(n==='home'&&(view.n==='home'||view.n==='detail'))||(n==='more'&&(view.n==='manage'||view.n==='sources'))||view.n===n?'on':'';return `<nav class="bnav"><button class="${o('dash')}" onclick="go('dash')">Dashboard</button><button class="${o('insights')}" onclick="go('insights')">Insights</button><button class="${o('home')}" onclick="lsrc='';go('home')">Loans</button><button class="${o('more')}" onclick="go('more')">More</button></nav><button class="fab" onclick="go('pick')" aria-label="New loan">+</button>`}
function more(){return `<header class="top"><h1>More</h1></header><h2 style="margin-top:0">Customize</h2><div class="box"><button class="btn sec" style="width:100%" onclick="go(\'manage\')">Manage dashboard</button><button class="btn sec" style="width:100%;margin-top:10px" onclick="go('sources')">Manage sources</button></div><h2>Theme</h2><div class="box">${THEMES.map(x=>`<button class="tbtn ${theme===x.id?'on':''}" onclick="setTheme('${x.id}')"><span class="tsw"><i style="background:${x.sw[0]}"></i><i style="background:${x.sw[1]}"></i><i style="background:${x.sw[2]}"></i></span><b>${x.name}</b></button>`).join('')}</div>${backupBox()}<h2>About this preview</h2><div class="box"><p class="mut" style="margin:0">Data is saved only in this browser. Use test data.</p></div>`}
function addPay(e,id){
  e.preventDefault();const l=loans.find(x=>x.id===id),d=$('#pd').value,a=+$('#pa').value;
  if(!d||!(a>0)){$('#perr').textContent='Enter a date and an amount greater than 0.';return}
  l.payments.push({date:d,amount:a,note:$('#pn').value.trim()});l.payments.sort((x,y)=>x.date<y.date?-1:1);save();render();
}
function delPay(id,i){loans.find(x=>x.id===id).payments.splice(i,1);save();render()}
function delLoan(id){if(!armed){armed=true;render();return}loans=loans.filter(x=>x.id!==id);save();go('home')}
function demo(){
  const p=[['2026-08-07',400],['2026-08-14',100],['2026-08-21',200],['2026-08-28',150],['2026-09-04',150],['2026-09-09',300],['2026-09-10',150],['2026-09-18',150],['2026-10-02',100],['2026-10-23',1000]];
  loans.push({id:'demo'+Date.now().toString(36),name:'Sample loan',source:'Open Bank',principal:10000,annualRate:.12,term:36,payment:370,startDate:'2026-07-07',firstDue:'2026-08-07',payments:p.map(x=>({date:x[0],amount:x[1],note:''}))});
  save();render();
}
(function(){const tabs=['insights','home','more'];let exitAt=0,te=null;
  const toast=m=>{try{if(!te){te=document.createElement('div');te.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;box-shadow:0 2px 10px rgba(0,0,0,.4)';document.body.appendChild(te)}te.textContent=m;te.style.display='block';setTimeout(()=>{if(te)te.style.display='none'},2200)}catch(e){}};
  try{history.replaceState({s:0},'');history.pushState({s:1},'')}catch(e){return}
  window.addEventListener('popstate',()=>{
    if(view.n==='dash'&&Date.now()-exitAt<2200){history.back();return}
    try{history.pushState({s:1},'')}catch(e){}
    if(view.n==='dash'){exitAt=Date.now();toast('Press back again to exit');return}
    if(tabs.includes(view.n)){go('dash');return}
    const b=document.querySelector('#app header.top button');if(b)b.click();else go('dash')})
})();
render();
</script><script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.claude){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})})}</script></body></html>
